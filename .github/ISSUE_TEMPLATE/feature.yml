name: Feature request
description: Propose a focused lifecycle-monitoring improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which integration or migration problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Privacy and network impact
      description: Explain any new data or outbound access involved.
    validations:
      required: true
