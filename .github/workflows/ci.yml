name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-deps --editable .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src

      - name: Test with branch coverage
        run: >-
          python -m pytest -q
          --cov=src
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=80
          --junitxml=test-results.xml

      - name: Build wheel and source distribution
        run: python -m build --no-isolation

      - name: Generate deterministic demo
        run: |
          python scripts/demo.py
          python scripts/generate_demo_image.py

      - name: Verify committed demo is current
        run: >-
          git diff --exit-code --
          docs/demo/assessment.json
          docs/demo/issue-drafts.json
          docs/demo/lifecycle.ics
          docs/demo/migration-checklist.md
          docs/demo/report.md
          docs/demo/sunset-sentinel-dashboard.png

      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-python-3.12
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload demo image
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-image
          path: docs/demo/sunset-sentinel-dashboard.png
          if-no-files-found: error
          retention-days: 14
