name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "docs/demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and synthetic demo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-deps --editable .

      - name: Run full local-equivalent quality gate
        run: python scripts/verify.py

      - name: Regenerate public demo without network access
        run: |
          python scripts/demo.py
          python scripts/generate_demo_image.py

      - name: Verify committed demo is current
        run: >-
          git diff --exit-code --
          docs/demo/assessment.json
          docs/demo/issue-drafts.json
          docs/demo/lifecycle.ics
          docs/demo/migration-checklist.md
          docs/demo/report.md
          docs/demo/sunset-sentinel-dashboard.png

  build:
    name: Assemble synthetic demo site
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Copy site and whitelisted synthetic artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/demo
          cp -R site/. _site/
          artifacts=(
            assessment.json
            benchmark.json
            issue-drafts.json
            lifecycle.ics
            migration-checklist.md
            report.md
            sunset-sentinel-dashboard.png
          )
          for artifact in "${artifacts[@]}"; do
            test -f "docs/demo/${artifact}"
            cp "docs/demo/${artifact}" "_site/demo/${artifact}"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy synthetic demo
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
