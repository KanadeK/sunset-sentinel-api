name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  dependency-and-secret-scan:
    name: Dependency and tracked-secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked audit tooling
        run: python -m pip install --requirement requirements-dev.lock

      - name: Audit locked dependencies
        run: >-
          python -m pip_audit
          --requirement requirements-dev.lock
          --strict
          --no-deps
          --disable-pip

      - name: Scan tracked files for high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          patterns='AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{70,255}|xox[baprs]-[A-Za-z0-9-]{10,255}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          if git grep -I -n -E "${patterns}" -- .; then
            echo "A high-confidence secret pattern was found in a tracked file." >&2
            exit 1
          fi
          echo "No high-confidence secret patterns found in tracked files."
