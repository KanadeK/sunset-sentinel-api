name: Release gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  package:
    name: Verify and package tag
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-deps --editable .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src

      - name: Test with branch coverage
        run: >-
          python -m pytest -q
          --cov=src
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Build wheel and source distribution
        run: python -m build --no-isolation

      - name: Refresh deterministic public demo
        run: |
          python scripts/demo.py
          python scripts/generate_demo_image.py

      - name: Verify committed demo is current
        run: >-
          git diff --exit-code --
          docs/demo/assessment.json
          docs/demo/issue-drafts.json
          docs/demo/lifecycle.ics
          docs/demo/migration-checklist.md
          docs/demo/report.md
          docs/demo/sunset-sentinel-dashboard.png

      - name: Assemble release assets and verify isolated wheel
        run: python scripts/package_release.py

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: sunset-sentinel-api-${{ github.ref_name }}
          path: dist-release/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --draft \
              --verify-tag \
              --title "${tag}" \
              --generate-notes
          fi
          gh release upload "${tag}" dist-release/* --clobber
          gh release edit "${tag}" --draft=false
